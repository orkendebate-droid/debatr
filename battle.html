<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Debatr — Баттл с ИИ-персонами</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Header -->
  <header class="site-header">
    <div class="header-container">
      <div class="brand">
        <a href="index.html" style="text-decoration:none; color:inherit;" class="brand-name">Debatr</a>
      </div>

      <nav class="nav-links">
        <a href="index.html" class="nav-btn active">Баттл</a>
        <a href="rooms.html" class="nav-btn">1 на 1</a>
        <a href="dashboard.html" class="nav-btn">Кабинет</a>
      </nav>

      <div class="header-right">
        <div id="user-profile-badge" class="user-badge hidden">
          <span id="user-display-name">Гость</span>
          <button id="btn-logout" class="btn-text-tiny">Выйти</button>
        </div>
        <button class="btn-secondary btn-sm" id="btn-open-auth">Вход</button>
        <button class="btn-settings" id="btn-open-settings" title="Настройки API">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        </button>
      </div>
    </div>
  </header>

  <main class="main-container">
    <div class="battle-container">
      
      <!-- 1. SETUP VIEW: Choose parameters & start -->
      <div id="battle-setup-view" class="glass-card battle-setup-card">
        <div class="setup-header">
          <h3>Параметры раунда</h3>
        </div>

        <!-- Level selection -->
        <div class="setup-group">
          <label class="form-label">Ваш уровень:</label>
          <div class="level-pills" id="setup-level-selector">
            <button type="button" class="level-pill-btn active" data-level="novice">Начальный</button>
            <button type="button" class="level-pill-btn" data-level="pragmatist">Средний</button>
            <button type="button" class="level-pill-btn" data-level="champion">Продвинутый</button>
            <button type="button" class="level-pill-btn" data-level="socrates">Мастер</button>
          </div>
        </div>

        <!-- Topic Category selection -->
        <div class="setup-group">
          <label class="form-label" for="setup-category-select">Сфера / Тема:</label>
          <select id="setup-category-select" class="form-input form-select">
            <option value="ai_tech" selected>ИИ и технологии</option>
            <option value="education">Образование и школа</option>
            <option value="ecology">Экология и климат</option>
            <option value="economy">Экономика и рынок труда</option>
            <option value="society">Общество и этика</option>
            <option value="politics">Политика и право</option>
          </select>
        </div>

        <!-- Topic resolution generated by AI -->
        <div class="setup-group">
          <div style="display:flex; justify-content:space-between; align-items:center;">
            <label class="form-label" style="margin-bottom:0;" for="setup-topic-input">Резолюция раунда:</label>
            <button type="button" class="btn-subtle btn-xs" id="btn-setup-random-topic" title="Сгенерировать резолюцию нейросетью">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
              <span id="btn-generate-topic-label">Сгенерировать ИИ</span>
            </button>
          </div>
          <textarea id="setup-topic-input" class="form-input setup-topic-textarea" placeholder="Резолюция генерируется нейросетью на основе выбранной сферы...">ЭП считает, что развитие автономных систем искусственного интеллекта должно жестко лицензироваться международным регулятором.</textarea>
        </div>

        <!-- Round Speech Timer Selection -->
        <div class="setup-group">
          <label class="form-label">Время раунда (таймер речи):</label>
          <div class="setup-timer-pills" id="setup-timer-selector">
            <button type="button" class="setup-timer-btn" data-sec="60">1 мин</button>
            <button type="button" class="setup-timer-btn" data-sec="180">3 мин</button>
            <button type="button" class="setup-timer-btn active" data-sec="240">4 мин</button>
            <button type="button" class="setup-timer-btn" data-sec="300">5 мин</button>
            <button type="button" class="setup-timer-btn" data-sec="420">7 мин</button>
          </div>
        </div>

        <!-- Chamber / Position selection -->
        <div class="setup-group">
          <label class="form-label">Ваша позиция:</label>
          <div class="role-pills" id="setup-role-selector">
            <button type="button" class="role-btn active" data-role="gov" id="role-gov-btn">Правительство</button>
            <button type="button" class="role-btn" data-role="opp" id="role-opp-btn">Оппозиция</button>
            <button type="button" class="role-btn" data-role="random" id="role-random-btn">Случайно</button>
          </div>
        </div>

        <!-- Start Button -->
        <div class="setup-actions">
          <button type="button" class="btn-primary btn-large btn-block" id="btn-start-battle">
            <span>Начать раунд с GPT-6 Luna</span>
          </button>
        </div>
      </div>

      <!-- 2. ACTIVE CHAT VIEW: Live debate with GPT-6 Luna (Full-Screen) -->
      <div id="battle-active-view" class="hidden">
        
        <!-- Active round top bar -->
        <div class="glass-card active-round-bar">
          <div class="round-bar-top">
            <div class="round-meta-badges">
              <span class="badge-tag" id="active-chamber-badge">Правительство</span>
              <span class="badge-tag" id="active-level-badge">Начальный</span>
              <span class="badge-tag badge-luna">GPT-6 Luna</span>
            </div>
            <div class="round-bar-actions">
              <button type="button" class="btn-subtle btn-xs" id="btn-back-to-setup">Параметры</button>
              <button type="button" class="btn-subtle btn-xs" id="btn-tts-toggle" title="Озвучивать ответы ИИ">Озвучка: Выкл</button>
              <button type="button" class="btn-primary btn-xs" id="btn-finish-battle-early" disabled>Завершить раунд</button>
            </div>
          </div>
          <h2 id="battle-topic-text" class="active-topic-heading"></h2>
        </div>

        <!-- Debate Speech Timer Widget -->
        <div class="debate-timer-bar">
          <div style="display:flex; align-items:center; gap:0.75rem;">
            <span style="font-size:0.8rem; font-weight:600; color:var(--text-muted);">Таймер:</span>
            <div class="timer-display" id="timer-display">04:00</div>
            <div class="time-pills">
              <button class="time-pill-btn" data-sec="60">1 мин</button>
              <button class="time-pill-btn active" data-sec="240">4 мин</button>
              <button class="time-pill-btn" data-sec="420">7 мин</button>
            </div>
          </div>
          <div class="timer-controls">
            <button class="btn-secondary btn-xs" id="btn-timer-toggle">Старт</button>
            <button class="btn-subtle btn-xs" id="btn-timer-reset">Сброс</button>
          </div>
        </div>

        <!-- Full-Screen Chat Feed & Input -->
        <div class="battle-chat-fullscreen">
          <div class="battle-feed" id="battle-feed">
            <div class="battle-msg-card msg-system">
              <span class="msg-author">Система</span>
              <p>Раунд начат. Уровень: <strong id="current-persona-name">Начальный</strong>.</p>
            </div>
          </div>

          <!-- Input area for user move -->
          <div class="glass-card battle-input-card">
            <textarea id="battle-speech-input" class="speech-textarea battle-textarea" placeholder="Ваш аргумент или опровержение..."></textarea>
            <div class="battle-actions-row">
              <div style="display:flex; gap:0.5rem; align-items:center;">
                <button type="button" class="btn-secondary" id="btn-battle-sample">Пример</button>
                <button type="button" class="btn-secondary" id="btn-voice-input" title="Нажмите, чтобы диктовать речь голосом">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="vertical-align:middle; margin-right:4px;"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></svg>
                  <span id="voice-btn-label">Голос</span>
                </button>
              </div>
              <button class="btn-primary" id="btn-battle-submit">
                <span>Отправить</span>
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
              </button>
            </div>
          </div>
        </div>

      </div>

      <!-- 3. VERDICT VIEW: Full-screen end of round feedback -->
      <div id="battle-verdict-view" class="hidden">
        <div class="glass-card battle-verdict-screen">
          <div class="verdict-banner" id="battle-winner-banner">
            <span class="trophy-icon">ИТОГ:</span>
            <div>
              <h3 id="battle-winner-title" style="margin:0; font-size:1.25rem;">Победитель</h3>
              <p id="battle-winner-subtitle" class="text-muted" style="margin-top:0.25rem; font-size:0.88rem;"></p>
            </div>
          </div>

          <div class="verdict-score-display">
            <span class="score-large" id="battle-user-overall">—</span>
            <div class="score-meta">
              <span class="score-label">Общий балл</span>
              <span class="badge-tag" id="battle-user-band">Ожидание</span>
            </div>
          </div>

          <div class="rubric-bars-compact">
            <div class="bar-mini"><span>Структура</span><span id="b-score-str">—</span></div>
            <div class="bar-mini"><span>Факты</span><span id="b-score-evi">—</span></div>
            <div class="bar-mini"><span>Опровержение</span><span id="b-score-reb">—</span></div>
            <div class="bar-mini"><span>Ясность</span><span id="b-score-cla">—</span></div>
            <div class="bar-mini"><span>Глубина</span><span id="b-score-org">—</span></div>
          </div>

          <div class="verdict-details-grid">
            <div class="feedback-block block-positive">
              <span class="block-title">Сильная сторона:</span>
              <p id="battle-analysis-strengths" class="block-text"></p>
            </div>

            <div class="feedback-block block-needs-work">
              <span class="block-title">Совет для роста:</span>
              <p id="battle-analysis-advice" class="block-text"></p>
            </div>
          </div>

          <div class="verdict-actions-row">
            <button type="button" class="btn-subtle" id="btn-battle-review-chat">Посмотреть чат</button>
            <button type="button" class="btn-primary" id="btn-battle-new-round">Новый раунд</button>
          </div>
        </div>
      </div>

    </div>
  </main>

  <!-- Auth Modal -->
  <div class="modal-overlay hidden" id="auth-modal">
    <div class="glass-card modal-card auth-card">
      <div class="modal-header">
        <h3 id="auth-title">Вход</h3>
        <button class="modal-close" id="btn-close-auth">&times;</button>
      </div>
      <div class="modal-body">
        <div class="auth-tabs">
          <button class="auth-tab active" id="tab-login">Вход</button>
          <button class="auth-tab" id="tab-register">Регистрация</button>
        </div>
        <form id="auth-form" onsubmit="return false;">
          <div class="form-group">
            <label class="form-label" for="auth-username">Имя</label>
            <input type="text" id="auth-username" class="form-input" placeholder="Имя" required>
          </div>
          <div class="form-group">
            <label class="form-label" for="auth-password">Пароль</label>
            <input type="password" id="auth-password" class="form-input" placeholder="Пароль" required>
          </div>
          <button class="btn-primary btn-block" id="btn-submit-auth">Войти</button>
        </form>
        <div class="auth-divider"><span>или</span></div>
        <button class="btn-guest btn-block" id="btn-guest-mode">Войти как гость</button>
      </div>
    </div>
  </div>

  <!-- Settings Modal -->
  <div class="modal-overlay hidden" id="settings-modal">
    <div class="glass-card modal-card">
      <div class="modal-header">
        <h3>Настройки API</h3>
        <button class="modal-close" id="btn-close-settings">&times;</button>
      </div>
      <div class="modal-body">
        <div class="form-group">
          <label class="form-label" for="supabase-url">URL Supabase:</label>
          <input type="text" id="supabase-url" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="supabase-key">Ключ Supabase:</label>
          <input type="password" id="supabase-key" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="ai-api-key">Ключ OpenAI:</label>
          <input type="password" id="ai-api-key" class="form-input">
        </div>
        <div class="form-group">
          <label class="form-label" for="ai-mode-select">Режим:</label>
          <select id="ai-mode-select" class="form-input">
            <option value="live-api">OpenAI API</option>
            <option value="luna-sim">Офлайн движок</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn-secondary" id="btn-reset-settings">Сброс</button>
        <button class="btn-primary" id="btn-save-settings">Сохранить</button>
      </div>
    </div>
  </div>

  <div class="toast hidden" id="toast"></div>

  <script src="app.js"></script>
</body>
</html>
