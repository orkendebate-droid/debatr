<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="100%" height="100%" style="background:#ffffff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <linearGradient id="rosehipGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#be123c"/>
    </linearGradient>
    <linearGradient id="mintGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="wormwoodGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
  </defs>

  <!-- Title -->
  <text x="360" y="35" text-anchor="middle" font-size="18" font-weight="bold" fill="#1e293b">
    Время воздействия реактивов на растения (минуты)
  </text>
  
  <!-- Subtitle / Note -->
  <text x="360" y="58" text-anchor="middle" font-size="12" fill="#64748b">
    (Чем меньше время реакции, тем выше антиоксидантная активность)
  </text>

  <!-- Y-Axis Grid Lines & Labels -->
  <!-- Max Y = 12 min, height = 240px (from y=80 to y=320, 20px per min) -->
  <g stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4">
    <line x1="90" y1="80" x2="660" y2="80"/>
    <line x1="90" y1="120" x2="660" y2="120"/>
    <line x1="90" y1="160" x2="660" y2="160"/>
    <line x1="90" y1="200" x2="660" y2="200"/>
    <line x1="90" y1="240" x2="660" y2="240"/>
    <line x1="90" y1="280" x2="660" y2="280"/>
    <line x1="90" y1="320" x2="660" y2="320" stroke-dasharray="none" stroke="#94a3b8"/>
  </g>

  <!-- Y Labels -->
  <g font-size="12" fill="#64748b" text-anchor="end">
    <text x="80" y="84">12 мин</text>
    <text x="80" y="124">10 мин</text>
    <text x="80" y="164">8 мин</text>
    <text x="80" y="204">6 мин</text>
    <text x="80" y="244">4 мин</text>
    <text x="80" y="284">2 мин</text>
    <text x="80" y="324">0 мин</text>
  </g>

  <!-- Group 1: Раствор йода (center: x=190) -->
  <rect x="135" y="280" width="32" height="40" rx="3" fill="url(#rosehipGrad)"/>
  <text x="151" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#be123c">2 мин</text>

  <rect x="174" y="220" width="32" height="100" rx="3" fill="url(#mintGrad)"/>
  <text x="190" y="213" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">5 мин</text>

  <rect x="213" y="160" width="32" height="160" rx="3" fill="url(#wormwoodGrad)"/>
  <text x="229" y="153" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">8 мин</text>

  <text x="190" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Раствор йода</text>

  <!-- Group 2: Перманганат калия (center: x=375) -->
  <rect x="320" y="280" width="32" height="40" rx="3" fill="url(#rosehipGrad)"/>
  <text x="336" y="273" text-anchor="middle" font-size="11" font-weight="bold" fill="#be123c">2 мин</text>

  <rect x="359" y="200" width="32" height="120" rx="3" fill="url(#mintGrad)"/>
  <text x="375" y="193" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">6 мин</text>

  <rect x="398" y="120" width="32" height="200" rx="3" fill="url(#wormwoodGrad)"/>
  <text x="414" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">10 мин</text>

  <text x="375" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Перманганат калия</text>

  <!-- Group 3: Перекись водорода (center: x=560) -->
  <rect x="505" y="240" width="32" height="80" rx="3" fill="url(#rosehipGrad)"/>
  <text x="521" y="233" text-anchor="middle" font-size="11" font-weight="bold" fill="#be123c">4 мин</text>

  <rect x="544" y="180" width="32" height="140" rx="3" fill="url(#mintGrad)"/>
  <text x="560" y="173" text-anchor="middle" font-size="11" font-weight="bold" fill="#047857">7 мин</text>

  <rect x="583" y="120" width="32" height="200" rx="3" fill="url(#wormwoodGrad)"/>
  <text x="599" y="113" text-anchor="middle" font-size="11" font-weight="bold" fill="#b45309">10 мин</text>

  <text x="560" y="345" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">Перекись водорода</text>

  <!-- Legend -->
  <g transform="translate(220, 385)">
    <rect x="0" y="0" width="14" height="14" rx="3" fill="url(#rosehipGrad)"/>
    <text x="22" y="12" font-size="12" font-weight="500" fill="#334155">Шиповник</text>

    <rect x="110" y="0" width="14" height="14" rx="3" fill="url(#mintGrad)"/>
    <text x="132" y="12" font-size="12" font-weight="500" fill="#334155">Мята</text>

    <rect x="210" y="0" width="14" height="14" rx="3" fill="url(#wormwoodGrad)"/>
    <text x="232" y="12" font-size="12" font-weight="500" fill="#334155">Полынь</text>
  </g>
</svg>